name: Update OpenDART data and deploy dashboard

on:
  schedule:
    - cron: "0 0 1 * *" # 매월 1일 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Keep the static-site deployment available even when the external DART
      # API is temporarily unavailable. The collection step reports its error,
      # and analyze.py never overwrites valid data with an empty result.
      - name: Collect and analyze OpenDART data
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/fetch_opendart.py --start-year 2010
          python scripts/analyze.py

      - name: Commit collected data
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "data: update Taihan Electric Wire OpenDART filings"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          rm -rf site
          mkdir -p site/data site/assets
          cp index.html site/index.html
          cp -r assets/. site/assets/
          cp data/dashboard.json site/data/dashboard.json
          touch site/.nojekyll
          test -s site/index.html
          test -s site/data/dashboard.json
          echo "Pages artifact prepared:"
          find site -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
